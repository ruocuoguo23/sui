[workspace]
resolver = "2"

exclude = ["upstream/sui"]

members = [
    "consensus/config",
    "consensus/core",
    "consensus/simtests",
    "consensus/types",
    "crates/mysten-common",
    "crates/mysten-metrics",
    "crates/mysten-network",
    "crates/prometheus-closure-metric",
    "crates/shared-crypto",
    "crates/telemetry-subscribers",
    "crates/typed-store",
    "crates/typed-store-derive",
    "crates/typed-store-error",
    "crates/sui-tls",
    "crates/sui-macros",
    "crates/sui-proc-macros",
    "crates/sui-enum-compat-util",
    "crates/sui-simulator",
    "crates/dagora-abci",
    "crates/dagora-abci-mock",
    "crates/dagora-core",
    "crates/dagora-node",
]

[workspace.package]
# Inherited upstream base version for crates using workspace.package.version.
version = "1.80.1"

[profile.release]
# debug = 1 means line charts only, which is minimum needed for good stack traces
debug = 1
# Write debug info into a separate file.
split-debuginfo = 'packed'
# Strip debug information from release binaries.
strip = 'debuginfo'
# Exit process with SIGABRT when any thread panics
panic = 'abort'

# Same as release, but unwind on panic.
[profile.release-unwind]
inherits = "release"
panic = 'unwind'

# Same as release, but build with lto (~50min build time).
[profile.release-lto]
inherits = "release"
# Enable Link Time Optimization for better runtime performance
lto = true
# Use single codegen unit to enable better optimizations
codegen-units = 1

# Same as release, but build binary with debug symbols (binary size will be ~ 1GB).
[profile.release-dbgsym]
inherits = "release"
split-debuginfo = 'off'
strip = 'none'

# Inherits from the release profile above.
[profile.bench]
# For convenience.
strip = 'none'

[profile.simulator]
inherits = "test"
debug = true
debug-assertions = true
overflow-checks = true
# opt-level 1 gives >5x speedup for simulator tests without slowing down build times very much.
opt-level = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(msim)',
  'cfg(fail_points)',
] }

# Project-wide clippy lints, applied by `cargo clippy` / `cargo xclippy`. Every workspace
# member must opt in with `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_macros = "warn"
disallowed_methods = "warn"
unnecessary_get_then_check = "allow"

# Dependencies that should be kept in sync through the whole workspace
[workspace.dependencies]
antithesis_sdk = "0.2.5"
anyhow = "1.0.71"
arc-swap = { version = "1.5.1", features = ["serde"] }
async-trait = "0.1.61"
atomic_float = "0.1"
axum = { version = "0.8", default-features = false, features = [
  "macros",
  "tokio",
  "http1",
  "http2",
  "json",
  "matched-path",
  "original-uri",
  "form",
  "query",
  "ws",
] }
axum-server = { version = "0.8", default-features = false, features = [
  "tls-rustls-no-provider",
] }
backoff = { version = "0.4.0", features = [
  "futures",
  "futures-core",
  "pin-project-lite",
  "tokio",
  "tokio_1",
] }
base64 = "0.21.2"
bcs = "0.1.4"
bincode = "1.3.3"
